services:
  engine:
    build:
      context: ./hr_exit_engine
    container_name: hr_exit_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./hr_exit_engine:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./hr_exit_web
    container_name: hr_exit_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./hr_exit_web:/app
      - /app/node_modules
    depends_on:
      - engine
